<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход через VK</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f7;
        }
        .loader { text-align: center; color: #666; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0077FF;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="loader">
    <div class="spinner"></div>
    <p>Входим в систему...</p>
</div>

<script src="/assets/vkid-sdk.js"></script>
<script src="/android.js"></script>
<script>
    (function() {
        'use strict';

        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var authError = params.get('error');
        var deviceId = params.get('device_id');

        if (authError || !code) {
            window.location.href = '/login.html';
            return;
        }

        var retries = 0;
        var maxRetries = 200;

        function waitForSdk() {
            if (typeof VKIDSDK === 'undefined') {
                retries++;
                if (retries < maxRetries) {
                    setTimeout(waitForSdk, 100);
                } else {
                    window.location.href = '/login.html';
                }
            } else {
                startAuthFlow();
            }
        }

        function startAuthFlow() {
            var VKID = VKIDSDK;

            VKID.Config.init({
                app: 54773774,
                redirectUrl: 'https://namahata.ru/auth_vk_callback.html',
                responseMode: VKID.ConfigResponseMode.Callback,
                source: VKID.ConfigSource.LOWCODE,
                scope: 'email'
            });

            VKID.Auth.exchangeCode(code, deviceId).then(function(result) {
                var payload = {
                    access_token: result.access_token,
                    id_token: result.id_token || ''
                };
                if (result.email) payload.email = result.email;

                return fetch('/api/auth_vk_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }).then(function(response) {
                return response.json();
            }).then(function(loginData) {
                if (!loginData.success) {
                    throw new Error(loginData.error || 'Login error');
                }

                localStorage.setItem('auth_token', loginData.token || '');
                localStorage.setItem('user_id', loginData.user_id);

                try {
                    if (typeof sendUserIdToAndroid === 'function') {
                        sendUserIdToAndroid();
                    }
                } catch (e) {}

                window.location.replace('/profile.html');
            }).catch(function(err) {
                console.error('VK Login Error:', err);
                window.location.href = '/login.html';
            });
        }

        waitForSdk();
    })();
</script>
</body>
</html>
