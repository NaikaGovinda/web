<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Бхакти-Врикша — Группы</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="back-btn" id="btnBack" aria-label="Назад" onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h1 class="org-name">ГРУППЫ</h1>
      <div class="header-actions">
        <button class="btn-icon" id="btnSearch" aria-label="Поиск"><span class="ico ico-search"></span></button>
        <button class="btn-icon" id="btnAdd" aria-label="Добавить группу"><span class="ico ico-plus"></span></button>
      </div>
    </header>

    <div class="filters">
      <button class="filter-btn active" data-filter="nearby">РЯДОМ</button>
      <button class="filter-btn" data-filter="online">ОНЛАЙН</button>
      <button class="filter-btn" data-filter="all">ВСЕ</button>
      <button class="filter-btn" id="btnMapFilter" data-filter="map">НА КАРТЕ</button>
    </div>

    <main class="content" id="groupsContainer">
      <div class="loading">Загрузка...</div>
    </main>

    <nav class="bottom-bar">
      <a href="/index.html" class="bar-btn">
        <span class="ico ico-home"></span>
        <span>🏡 Домой</span>
      </a>
      <a href="/namahatta.html" class="bar-btn">
        <span class="ico ico-namahatta"></span>
        <span>🌸 Нама-Хатта</span>
      </a>
      <a href="/profile.html" class="bar-btn">
        <span class="ico ico-profile"></span>
        <span>👤 Профиль</span>
      </a>
    </nav>
  </div>

  <!-- Модальное окно карты -->
  <div id="mapModal" class="modal" style="display:none;">
    <div class="modal-content" style="height: 80vh; padding: 0;">
      <div id="map" style="width:100%; height:100%;"></div>
      <button id="closeMap" class="btn btn-ghost" style="position:absolute; top:12px; right:12px; z-index:1000;">Закрыть</button>
    </div>
  </div>

  <script>
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Функция для получения координат браузера
    function getUserLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                (err) => {
                    // [ИСПРАВЛЕНИЕ] Если Android заблокировал окно, мы ловим ошибку 
                    // и возвращаем null, чтобы сайт не зависал, а просто показал группы без сортировки
                    console.warn("Геолокация недоступна:", err.message);
                    resolve(null); 
                },
                { timeout: 5000, enableHighAccuracy: true }
            );
        });
    }
    
    async function loadGroups(filter = 'nearby') {
        const container = document.getElementById('groupsContainer');
        container.innerHTML = '<div class="loading">Загрузка...</div>';
    
        try {
            // Определяем базовый тип для текущего файла (в bhakti_vriksha.html замените 'namahatta' на 'bhakti_vriksha')
            const currentType = 'bhakti_vriksha';
            let url = `/api/get_groups.php?type=${currentType}`;
    
            if (filter === 'online') {
                url += '&online=1';
            } else if (filter === 'all' || filter === 'map') {
                url += '&all=1';
            }
    
            // [НОВОЕ] Если выбран фильтр РЯДОМ, запрашиваем координаты пользователя и добавляем их в URL

            if (filter === 'nearby') {
                const loc = await getUserLocation();
                if (loc) {
                    url += `&user_lat=${loc.lat}&user_lng=${loc.lng}`;
                }
            }
            /*
            if (filter === 'nearby') {
                url += `&user_lat=&user_lng=`; 
            }
    */
            const response = await fetch(url);
            const data = await response.json();
    
            if (!data.success) throw new Error(data.error || 'Ошибка сервера');
    
            container.innerHTML = '';
            if (data.groups.length === 0) {
                container.innerHTML = '<p class="empty-state">Группы не найдены</p>';
                return;
            }
    
            data.groups.forEach(group => {
                const isOnline = group.is_online === '1' || group.is_online === 1;
                
                // [ИСПРАВЛЕНИЕ] Больше никакого Math.random()! Берем реальное расстояние от бэкенда
                let distanceText = '';
                if (isOnline) {
                    distanceText = 'Онлайн';
                } else if (group.distance !== undefined && group.distance !== null) {
                    const dist = parseFloat(group.distance);
                    distanceText = `${escapeHtml(group.city)} • ${dist < 1 ? Math.round(dist * 1000) + ' м' : dist.toFixed(1) + ' км'}`;
                } else {
                    distanceText = `${escapeHtml(group.city)}`;
                }
    
                const card = document.createElement('div');
                card.className = 'group-card card';
                card.innerHTML = `
                    <div class="status-indicator">${isOnline ? '🟢' : '🔵'}</div>
                    <div class="group-info">
                        <h3 class="group-title">${escapeHtml(group.name)}</h3>
                        <p class="group-desc">${escapeHtml(group.description)}</p>
                        <div class="group-meta">
                            <span>📍 </span> ${distanceText} • 
                            <span>👥 </span> ${group.member_count} участников
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = `/group.html?id=${group.id}`;
                });
                container.appendChild(card);
            });
    
        } catch (error) {
            console.error('Ошибка:', error);
            container.innerHTML = '<p class="error-state">Не удалось загрузить группы</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.dataset.filter;

          if (filter === 'map') {
            openMapModal();
          } else {
            loadGroups(filter);
          }
        });
      });

      loadGroups('nearby');

      document.getElementById('closeMap')?.addEventListener('click', () => {
        document.getElementById('mapModal').style.display = 'none';
      });
    });

    // === Карта ===
    let mapInitialized = false;
    let cachedMapGroups = null;

    async function loadLeaflet() {
      return new Promise((resolve) => {
        if (typeof L !== 'undefined') {
          resolve();
          return;
        }
        if (!document.getElementById('leaflet-css')) {
          const css = document.createElement('link');
          css.id = 'leaflet-css';
          css.rel = 'stylesheet';
          css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
          document.head.appendChild(css);
        }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        script.onload = () => resolve();
        document.head.appendChild(script);
      });
    }
	
    let leafletMapInstance = null; // Добавим для отслеживания экземпляра карты

    async function openMapModal() {
      document.getElementById('mapModal').style.display = 'flex';

      // Если карта уже была создана ранее, просто обновляем её размеры
      if (mapInitialized && leafletMapInstance) {
        setTimeout(() => {
          leafletMapInstance.invalidateSize();
        }, 100);
        return;
      }

      try {
        await loadLeaflet();
        const mapContainer = document.getElementById('map');
        mapContainer.innerHTML = '';

        // Получаем геолокацию пользователя
        let mapCenter = [55.751244, 37.618423]; // Москва по умолчанию
        let mapZoom = 10;

        const userLoc = await getUserLocation();
        if (userLoc) {
          mapCenter = [userLoc.lat, userLoc.lng];
          mapZoom = 12;
        }

        const map = L.map('map').setView(mapCenter, mapZoom);
        leafletMapInstance = map;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>'
        }).addTo(map);

        // [ИЗМЕНЕНО] Тип группы для Бхакти-Врикши
        const currentType = 'bhakti_vriksha';

        const res = await fetch(`/api/get_groups_for_map.php?type=${currentType}`);
        const mapGroups = await res.json();

        // [ДОБАВЛЕНО] Проверка, что API вернул массив
        if (!Array.isArray(mapGroups)) {
          console.error('API вернул не массив:', mapGroups);
          showToast('❌ Ошибка загрузки групп для карты');
          return;
        }

        if (mapGroups.length > 0) {
          let latSum = 0, lngSum = 0, validCount = 0;

          const groupsByAddress = {};

          mapGroups.forEach(group => {
            if (group.lat && group.lng) {
              const lat = parseFloat(group.lat);
              const lng = parseFloat(group.lng);
              if (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return;

              const coordKey = lat.toFixed(5) + "_" + lng.toFixed(5);

              if (!groupsByAddress[coordKey]) {
                groupsByAddress[coordKey] = {
                  lat: lat,
                  lng: lng,
                  groupsList: []
                };
              }
              groupsByAddress[coordKey].groupsList.push(group);
            }
          });

          Object.keys(groupsByAddress).forEach(key => {
            const point = groupsByAddress[key];

            latSum += point.lat;
            lngSum += point.lng;
            validCount++;

            const currentMarker = L.marker([point.lat, point.lng]).addTo(map);

            let popupHtml = '<div style="font-family: \'Montserrat\', sans-serif; min-width: 170px; max-width: 240px; max-height: 240px; overflow-y: auto; padding-right: 3px; text-align: center;">';

            point.groupsList.forEach((group, index) => {
              if (index > 0) {
                popupHtml += '<hr style="border: 0; border-top: 1px solid #e0e0e0; margin: 10px 0;">';
              }

              popupHtml += '<div>';
              popupHtml += '   <b style="color: #4a90e2; font-size: 13px; display: block; margin-bottom: 2px;">' + escapeHtml(group.name) + '</b>';
              popupHtml += '   <span style="color: #333; font-size: 11px; display: block; margin-bottom: 2px;">🏙️ ' + escapeHtml(group.city) + '</span>';
              popupHtml += '   <span style="color: #666; font-size: 11px; display: block; margin-bottom: 8px; font-style: italic;">🏠 ' + (group.address ? escapeHtml(group.address) : 'Адрес не указан') + '</span>';
              popupHtml += '   <a href="/group.html?id=' + group.id + '" style="display: inline-block; padding: 6px 14px; background: #4a90e2; color: #fff; text-decoration: none; border-radius: 6px; font-size: 11px; font-weight: 600; box-shadow: 0 2px 4px rgba(74,144,226,0.2);">Перейти в группу ➡️</a>';
              popupHtml += '</div>';
            });

            popupHtml += '</div>';

            currentMarker.bindPopup(popupHtml);
          });

          // [ВАЖНО] Центрируем карту только если не получили геолокацию
          if (validCount > 0 && !userLoc) {
            map.setView([latSum / validCount, lngSum / validCount], 10);
          }
        } else {
          showToast('ℹ️ Нет групп с координатами для отображения');
        }

        mapInitialized = true;
        setTimeout(() => {
          map.invalidateSize();
        }, 100);

      } catch (err) {
        console.error('Ошибка карты:', err);
        showToast('❌ Ошибка загрузки карты: ' + err.message);
      }
    }
  </script>
 
<script>
 const IS_DEBUG = true; 
 const APP_VERSION = '1.0.0'; 

 (function() {
     const version = IS_DEBUG ? Date.now() : APP_VERSION;

     const mainStyle = document.querySelector('link[href^="style.css"]');
     if (mainStyle) {
         mainStyle.href = 'style.css?v=' + version;
     }

     const themeScript = document.createElement('script');
     themeScript.src = 'theme.js?v=' + version;
     document.body.appendChild(themeScript);
 })();
</script>
<script src="/android.js"></script> 
  
</body>
</html>
