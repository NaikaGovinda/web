<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Восстановление пароля — Нама-Хатта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='/login.html'" aria-label="Назад">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <h1 class="org-name">Сброс пароля</h1>
    </header>

    <main class="content">
        <div class="auth-card">
            <h2>Восстановление доступа</h2>
            <p class="auth-subtitle">Мы отправим код на ваш email</p>

            <!-- ЭТАП 1: Запрос кода -->
            <form id="requestStepForm">
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" class="input-field" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btnSendCode">Получить код</button>
            </form>

            <!-- ЭТАП 2: Код + новый пароль -->
            <form id="resetStepForm" style="display: none;">
                <div class="form-group">
                    <label for="resetCode">Код подтверждения</label>
                    <input type="text" id="resetCode" class="input-field" placeholder="000000" maxlength="6" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">Новый пароль</label>
                    <input type="password" id="newPassword" class="input-field" placeholder="Минимум 6 символов" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btnChangePassword">Сменить пароль</button>
            </form>
        </div>
    </main>
</div>

<script src="/android.js"></script>
<script>
 const IS_DEBUG = true; 
 const APP_VERSION = '1.0.0'; 
 (function() {
     const version = IS_DEBUG ? Date.now() : APP_VERSION;
     const mainStyle = document.querySelector('link[href^="style.css"]');
     if (mainStyle) { mainStyle.href = 'style.css?v=' + version; }
     const themeScript = document.createElement('script');
     themeScript.src = 'theme.js?v=' + version;
     document.body.appendChild(themeScript);
 })();
</script>

<script>
let userResetEmail = '';

document.getElementById('requestStepForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const emailInput = document.getElementById('resetEmail').value.trim();
    const button = document.getElementById('btnSendCode');
    button.disabled = true;
    button.textContent = 'Отправка...';

    try {
        const response = await fetch('/api/forgot_password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'send_code', email: emailInput })
        });
        const result = await response.json();

        if (result.success) {
            showToast('✅ Код отправлен на почту!');
            userResetEmail = emailInput;
            document.getElementById('requestStepForm').style.display = 'none';
            document.getElementById('resetStepForm').style.display = 'block';
        } else {
            showToast('❌ ' + (result.error || 'Ошибка при отправке'));
        }
    } catch (err) {
        console.error(err);
        showToast('❌ Ошибка соединения');
    } finally {
        button.disabled = false;
        button.textContent = 'Получить код';
    }
});

document.getElementById('resetStepForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const codeInput = document.getElementById('resetCode').value.trim();
    const passwordInput = document.getElementById('newPassword').value;
    const button = document.getElementById('btnChangePassword');

    if (passwordInput.length < 6) {
        showToast('❌ Пароль должен быть не менее 6 символов');
        return;
    }

    button.disabled = true;
    button.textContent = 'Сохранение...';

    try {
        const response = await fetch('/api/forgot_password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'reset_password', email: userResetEmail, code: codeInput, password: passwordInput })
        });
        const result = await response.json();

        if (result.success) {
            showToast('🎉 Пароль изменен!');
            setTimeout(() => { window.location.href = '/login.html'; }, 1200);
        } else {
            showToast('❌ ' + (result.error || 'Неверный код'));
        }
    } catch (err) {
        console.error(err);
        showToast('❌ Ошибка сети');
    } finally {
        button.disabled = false;
        button.textContent = 'Сменить пароль';
    }
});
</script>
</body>
</html>
