<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Восстановление пароля — Нама-Хатта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <!-- Шапка страницы -->
    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='/login.html'" aria-label="Назад">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <h1 class="org-name">Сброс пароля</h1>
    </header>

    <main class="content">
        <div class="card">
            <h2>Восстановление доступа</h2>
            
            <!-- ЭТАП 1: Запрос кода на Email -->
            <form id="requestStepForm">
                <p style="color: var(--color-text-muted, #666); font-size: 14px; margin-bottom: 15px;">
                    Введите Email, указанный при регистрации. Мы отправим на него 6-значный код для сброса пароля.
                </p>
                <input type="email" id="resetEmail" class="input-field" placeholder="Ваш Email" required><br><br>
                <button type="submit" class="btn btn-primary" id="btnSendCode">Получить код</button>
            </form>

            <!-- ЭТАП 2: Ввод кода и нового пароля (по умолчанию скрыт) -->
            <form id="resetStepForm" style="display: none;">
                <p style="color: var(--color-text-muted, #666); font-size: 14px; margin-bottom: 15px;">
                    Код успешно отправлен! Проверьте вашу почту (включая папку Спам) и введите данные ниже.
                </p>
                <input type="text" id="resetCode" class="input-field" placeholder="6-значный код" maxlength="6" required><br><br>
                <input type="password" id="newPassword" class="input-field" placeholder="Новый пароль (мин. 6 символов)" required><br><br>
                <button type="submit" class="btn btn-primary" id="btnChangePassword">Сменить пароль</button>
            </form>
        </div>
    </main>
</div>


<script src="/android.js"></script>
<script>
 const IS_DEBUG = true; 
 const APP_VERSION = '1.0.0'; 

 (function() {
     const version = IS_DEBUG ? Date.now() : APP_VERSION;

     const mainStyle = document.querySelector('link[href^="style.css"]');
     if (mainStyle) {
         mainStyle.href = 'style.css?v=' + version;
     }

     const themeScript = document.createElement('script');
     themeScript.src = 'theme.js?v=' + version;
     document.body.appendChild(themeScript);
 })();
</script>

<script>
// Глобальная переменная для запоминания email между шагами
let userResetEmail = '';

// Логика ЭТАПА 1: Отправка кода
document.getElementById('requestStepForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const emailInput = document.getElementById('resetEmail').value.trim();
    const button = document.getElementById('btnSendCode');
    
    button.disabled = true;
    button.textContent = 'Отправка...';

    try {
        const response = await fetch('/api/forgot_password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'send_code', email: emailInput })
        });
        const result = await response.json();

        if (result.success) {
            showToast('✅ Код отправлен на почту!');
            userResetEmail = emailInput; // Запоминаем email
            
            // Переключаем видимость форм
            document.getElementById('requestStepForm').style.display = 'none';
            document.getElementById('resetStepForm').style.display = 'block';
        } else {
            showToast('❌ ' + (result.error || 'Ошибка при отправке'));
        }
    } catch (err) {
        console.error(err);
        showToast('❌ Ошибка соединения с сервером');
    } finally {
        button.disabled = false;
        button.textContent = 'Получить код';
    }
});

// Логика ЭТАПА 2: Смена пароля по коду
document.getElementById('resetStepForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const codeInput = document.getElementById('resetCode').value.trim();
    const passwordInput = document.getElementById('newPassword').value;
    const button = document.getElementById('btnChangePassword');

    if (passwordInput.length < 6) {
        showToast('❌ Пароль должен быть не менее 6 символов');
        return;
    }

    button.disabled = true;
    button.textContent = 'Сохранение...';

    try {
        const response = await fetch('/api/forgot_password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                action: 'reset_password', 
                email: userResetEmail, 
                code: codeInput, 
                password: passwordInput 
            })
        });
        const result = await response.json();

        if (result.success) {
            showToast('🎉 Пароль успешно изменен!');
            // Через секунду перекидываем на вход
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 1200);
        } else {
            showToast('❌ ' + (result.error || 'Неверный код'));
        }
    } catch (err) {
        console.error(err);
        showToast('❌ Ошибка сети при смене пароля');
    } finally {
        button.disabled = false;
        button.textContent = 'Сменить пароль';
    }
});
</script>
</body>
</html>
