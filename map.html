<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Карта — Namahatta</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=70162547-5136-412f-9467-331b66df8772" type="text/javascript"></script>
</head>
<body>
    <div id="app" style="display: flex; flex-direction: column; height: 100vh; height: 100dvh;">
        <header class="app-header" style="display: flex; align-items: center; padding: 12px 16px; background: var(--color-bg, #fff); border-bottom: 1px solid rgba(0,0,0,0.08); z-index: 10;">
            <button class="back-btn" id="btnBack" aria-label="Назад" onclick="if(document.referrer){history.back();}else{window.location.href='index.html';}" style="background:none; border:none; cursor:pointer; padding:4px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <span style="font-weight: 700; font-size: 17px; flex: 1; text-align: center;" id="pageTitle">Карта групп</span>
            <div style="width: 24px;"></div>
        </header>

        <div id="map" style="flex: 1; width: 100%; position: relative;"></div>

        <nav class="bottom-bar">
            <a href="index.html" class="bar-btn">
                <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Главная</span>
            </a>
            <a href="namahatta.html" class="bar-btn">
                <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Группы</span>
            </a>
            <a href="map.html" class="bar-btn bar-btn-active">
                <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span>Карта</span>
            </a>
            <a href="profile.html" class="bar-btn">
                <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Профиль</span>
            </a>
        </nav>
    </div>

    <script type="text/javascript">
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getUserLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                    (err) => { console.warn("Геолокация недоступна:", err.message); resolve(null); },
                    { timeout: 5000, enableHighAccuracy: true }
                );
            });
        }

        ymaps.ready(init);

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const groupType = urlParams.get('type') || '';
            const cityParam = urlParams.get('city') || '';

            if (groupType === 'namahatta') {
                document.getElementById('pageTitle').textContent = 'Группы Нама-Хатта на карте';
            } else if (groupType === 'bhakti_vriksha') {
                document.getElementById('pageTitle').textContent = 'Группы Бхакти-Врикша на карте';
            }

            let initialCenter = [55.751244, 37.618423];
            let initialZoom = 10;

            const userLoc = await getUserLocation();
            if (userLoc) {
                initialCenter = [userLoc.lat, userLoc.lng];
                initialZoom = 11;
            }

            const myMap = new ymaps.Map("map", {
                center: initialCenter,
                zoom: initialZoom,
                controls: ['zoomControl', 'geolocationControl', 'typeSelector']
            });

            const clusterer = new ymaps.Clusterer({
                preset: 'islands#invertedBlueClusterIcons',
                groupByCoordinates: false,
                clusterDisableClickZoom: false
            });

            let fetchUrl = `/api/get_groups_for_map.php?type=${encodeURIComponent(groupType)}`;
            if (cityParam) {
                fetchUrl += `&city=${encodeURIComponent(cityParam)}`;
            }

            try {
                const response = await fetch(fetchUrl);
                const groups = await response.json();

                if (Array.isArray(groups) && groups.length > 0) {
                    const placemarks = groups.map(group => {
                        const lat = parseFloat(group.lat);
                        const lng = parseFloat(group.lng);
                        if (isNaN(lat) || isNaN(lng)) return null;

                        const cityName = escapeHtml(group.city || '');
                        const addressName = escapeHtml(group.address || '');
                        const locationText = [cityName, addressName].filter(Boolean).join(', ');

                        return new ymaps.Placemark([lat, lng], {
                            balloonContentHeader: `<div style="font-family: Montserrat, sans-serif; font-size: 15px; font-weight: 700; color: #1d1d1f;">${escapeHtml(group.name)}</div>`,
                            balloonContentBody: `
                                <div style="font-family: Montserrat, sans-serif; padding-top: 4px;">
                                    ${locationText ? `<p style="font-size: 12px; color: #666; margin: 0 0 6px 0;">📍 ${locationText}</p>` : ''}
                                    ${group.description ? `<p style="font-size: 12px; color: #333; margin: 0 0 10px 0; max-height: 60px; overflow: hidden;">${escapeHtml(group.description)}</p>` : ''}
                                    <a class="btn" href="group.html?id=${group.id}" style="display: inline-block; padding: 7px 14px; background: #0071e3; color: #fff; text-decoration: none; border-radius: 8px; font-size: 12px; font-weight: 600;">Перейти к группе ➡️</a>
                                </div>
                            `
                        }, {
                            preset: group.type === 'bhakti_vriksha' ? 'islands#greenHomeIcon' : 'islands#blueHomeIcon'
                        });
                    }).filter(Boolean);

                    clusterer.add(placemarks);
                    myMap.geoObjects.add(clusterer);

                    if (placemarks.length > 0 && !userLoc) {
                        myMap.setBounds(clusterer.getBounds(), { zoomMargin: 50, checkZoomRange: true });
                    }
                }
            } catch (err) {
                console.error("Ошибка загрузки данных карты:", err);
            }
        }
    </script>
    <script src="android.js"></script>
    <script src="theme.js"></script>
</body>
</html>
