<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Подтверждение email — Нама-Хатта</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="back-btn" onclick="history.back()" aria-label="Назад">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h1 class="org-name">Подтверждение</h1>
    </header>

    <main class="content">
      <div class="auth-card">
        <h2>Введите код</h2>
        <p class="auth-subtitle">Код отправлен на ваш email</p>

        <!-- ЭТАП 1: Ввод кода -->
        <div id="verifyCodeBlock">
          <div class="form-group">
            <label for="verificationCode">Код подтверждения</label>
            <input type="text" id="verificationCode" class="input-field" placeholder="000000" maxlength="6" required>
          </div>
          <button id="verifyBtn" class="btn btn-primary">Подтвердить</button>
          <div class="auth-footer">
            <a href="#" id="resendLink">Не пришёл код? Отправить повторно</a>
          </div>
        </div>

        <!-- ЭТАП 2: Повторная отправка -->
        <div id="resendEmailBlock" style="display: none;">
          <div class="form-group">
            <label for="resendEmailInput">Email</label>
            <input type="email" id="resendEmailInput" class="input-field" placeholder="your@email.com">
          </div>
          <button id="btnExecuteResend" class="btn btn-primary">Выслать код</button>
          <div class="auth-footer">
            <a href="#" id="btnBackToVerify">← Вернуться к вводу кода</a>
          </div>
        </div>
      </div>
    </main>
  </div>

<script src="/android.js"></script>
<script>
 const IS_DEBUG = true; 
 const APP_VERSION = '1.0.0'; 
 (function() {
     const version = IS_DEBUG ? Date.now() : APP_VERSION;
     const mainStyle = document.querySelector('link[href^="style.css"]');
     if (mainStyle) { mainStyle.href = 'style.css?v=' + version; }
     const themeScript = document.createElement('script');
     themeScript.src = 'theme.js?v=' + version;
     document.body.appendChild(themeScript);
 })();
</script>

<script>
document.getElementById('verifyBtn')?.addEventListener('click', async () => {
    const code = document.getElementById('verificationCode').value.trim();
    if (code.length !== 6) { showToast('⚠️ Код должен быть 6-значным'); return; }
    
    const button = document.getElementById('verifyBtn');
    button.disabled = true;
    button.textContent = 'Проверка...';
    
    try {
        const res = await fetch('/api/verify_email.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (data.success) {
            showToast('🎉 Email подтверждён!');
            setTimeout(() => { window.location.href = '/login.html'; }, 1200);
        } else {
            showToast('❌ ' + (data.error || 'Неверный код'));
        }
    } catch (err) {
        showToast('❌ Ошибка соединения');
    } finally {
        button.disabled = false;
        button.textContent = 'Подтвердить';
    }
});

document.getElementById('resendLink')?.addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('verifyCodeBlock').style.display = 'none';
    document.getElementById('resendEmailBlock').style.display = 'block';
});

document.getElementById('btnBackToVerify')?.addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('resendEmailBlock').style.display = 'none';
    document.getElementById('verifyCodeBlock').style.display = 'block';
});

document.getElementById('btnExecuteResend')?.addEventListener('click', async () => {
    const email = document.getElementById('resendEmailInput').value.trim();
    if (!email || !email.includes('@')) { showToast('⚠️ Введите корректный email'); return; }
    
    const button = document.getElementById('btnExecuteResend');
    button.disabled = true;
    button.textContent = 'Отправка...';
    
    try {
        const res = await fetch('/api/resend_verification.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.success) {
            showToast('📩 Новый код отправлен!');
            document.getElementById('resendEmailBlock').style.display = 'none';
            document.getElementById('verifyCodeBlock').style.display = 'block';
            document.getElementById('verificationCode').value = '';
        } else {
            showToast('❌ ' + (data.error || 'Не удалось отправить'));
        }
    } catch (err) {
        showToast('❌ Ошибка сети');
    } finally {
        button.disabled = false;
        button.textContent = 'Выслать код';
    }
});
</script>
</body>
</html>
