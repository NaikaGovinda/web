<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Подтверждение email — Нама-Хатта</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="back-btn" onclick="history.back()" aria-label="Назад">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h1 class="org-name">Подтверждение email</h1>
    </header>

    <main class="content">
        <div class="card">
            <!-- ЭТАП 1: Основная форма ввода кода -->
            <div id="verifyCodeBlock">
                <h2>Введите код подтверждения</h2>
                <p style="color: var(--color-text-muted, #666); font-size: 14px; margin-bottom: 15px;">Код был отправлен на ваш email.</p>
                
                <input type="text" id="verificationCode" class="input-field" placeholder="6-значный код" maxlength="6" required><br><br>
                <button id="verifyBtn" class="btn btn-primary">Подтвердить</button>
                
                <p style="text-align:center; margin-top:16px;">
                    Не пришел код? <a href="#" id="resendLink" style="color: var(--color-primary, #4a90e2); text-decoration: none;">Отправить повторно</a>
                </p>
            </div>

            <!-- ЭТАП 2: Форма ручного ввода Email для переотправки (вместо prompt, изначально скрыта) -->
            <div id="resendEmailBlock" style="display: none;">
                <h2>Повторная отправка</h2>
                <p style="color: var(--color-text-muted, #666); font-size: 14px; margin-bottom: 15px;">Укажите ваш Email, чтобы система сгенерировала и выслала новый код подтверждения.</p>
                
                <input type="email" id="resendEmailInput" class="input-field" placeholder="Ваш Email"><br><br>
                <button id="btnExecuteResend" class="btn btn-primary">Выслать код</button>
                
                <p style="text-align:center; margin-top:16px;">
                    <a href="#" id="btnBackToVerify" style="color: var(--color-text-muted, #666); text-decoration: none; font-size: 14px;">← Вернуться назад</a>
                </p>
            </div>
        </div>
    </main>
</div>



<script>
// ЛОГИКА 1: Проверка введённого 6-значного кода регистрации
document.getElementById('verifyBtn').addEventListener('click', async () => {
    const code = document.getElementById('verificationCode').value.trim();
    
    if (code.length !== 6) {
        showToast('⚠️ Код должен быть строго 6-значным');
        return;
    }
    
    const button = document.getElementById('verifyBtn');
    button.disabled = true;
    button.textContent = 'Проверка...';
    
    try {
        const res = await fetch('/api/verify_email.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        });
        const data = await res.json();
        
        if (data.success) {
            showToast('🎉 Email успешно подтвержден! Перенаправление...');
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 1200);
        } else {
            showToast('❌ ' + (data.error || 'Неверный или просроченный код'));
        }
    } catch (err) {
        showToast('❌ Не удалось подключиться к серверу');
        console.error(err);
    } finally {
        button.disabled = false;
        button.textContent = 'Подтвердить';
    }
});

// ЛОГИКА 2: Переключение интерфейса на форму ввода Email (Вместо prompt)
document.getElementById('resendLink').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('verifyCodeBlock').style.display = 'none';
    document.getElementById('resendEmailBlock').style.display = 'block';
});

// Возврат к вводу кода
document.getElementById('btnBackToVerify').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('resendEmailBlock').style.display = 'none';
    document.getElementById('verifyCodeBlock').style.display = 'block';
});

// ЛОГИКА 3: Сетевой запрос повторной генерации кода на бэкенд
document.getElementById('btnExecuteResend').addEventListener('click', async () => {
    const email = document.getElementById('resendEmailInput').value.trim();
    
    if (!email || !email.includes('@')) {
        showToast('⚠️ Пожалуйста, введите корректный Email адрес');
        return;
    }
    
    const button = document.getElementById('btnExecuteResend');
    button.disabled = true;
    button.textContent = 'Отправка...';
    
    try {
        const res = await fetch('/api/resend_verification.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if (data.success) {
            showToast('📩 Новый код успешно отправлен на вашу почту!');
            // Возвращаем пользователя обратно к форме ввода кода
            document.getElementById('resendEmailBlock').style.display = 'none';
            document.getElementById('verifyCodeBlock').style.display = 'block';
            document.getElementById('verificationCode').value = ''; // Очищаем старый инпут
        } else {
            showToast('❌ ' + (data.error || 'Не удалось отправить код повторно'));
        }
    } catch (err) {
        showToast('❌ Ошибка сети. Не удалось отправить код.');
        console.error(err);
    } finally {
        button.disabled = false;
        button.textContent = 'Выслать код';
    }
});
</script>
<!-- КРИТИЧНО: Подключаем тему с showToast и мост Android -->

<script src="/android.js"></script>
<script>
 const IS_DEBUG = true; 
 const APP_VERSION = '1.0.0'; 

 (function() {
     const version = IS_DEBUG ? Date.now() : APP_VERSION;

     const mainStyle = document.querySelector('link[href^="style.css"]');
     if (mainStyle) {
         mainStyle.href = 'style.css?v=' + version;
     }

     const themeScript = document.createElement('script');
     themeScript.src = 'theme.js?v=' + version;
     document.body.appendChild(themeScript);
 })();
</script>

</body>
</html>
