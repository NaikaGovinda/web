<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Мой профиль — Нама-Хатта</title>
    <!-- <link href="https://googleapis.com" rel="stylesheet"> -->
    <link rel="stylesheet" href="style.css">
	<script src="assets/custom-cropper.js"></script>
</head>
<body>
<div id="app">
    <!-- Шапка -->
    <header class="app-header">
        <button class="back-btn" id="btnBack" aria-label="Назад" onclick="window.location.href='/index.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <h1 class="org-name">МОЙ ПРОФИЛЬ</h1>
    </header>

    <!-- Основной контент -->
    <main class="content" id="profileContent">
        <div class="loading">Загрузка...</div>
    </main>

    <!-- Нижняя панель -->
    <nav class="bottom-bar">
        <a href="/index.html" class="bar-btn">
            <span class="ico ico-home"></span>
            <span>Домой</span>
        </a>
        <a href="/namahatta.html" class="bar-btn">
            <span class="ico ico-namahatta"></span>
            <span>Нама-Хатта</span>
        </a>
        <a href="/profile.html" class="bar-btn bar-btn-active">
            <span class="ico ico-profile"></span>
            <span>Профиль</span>
        </a>
    </nav>
</div>

<script>
    
    // Защита от XSS
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    /*
    // Универсальное уведомление вместо системного alert
    function showToast(message) {
        // Удаляем старый toast, если он остался в деструкторе
        const oldToast = document.getElementById('appToast');
        if (oldToast) oldToast.remove();
    
        // Создаем элемент плашки
        const toast = document.createElement('div');
        toast.id = 'appToast';
        toast.className = 'toast-notification';
        toast.textContent = message;
        document.body.appendChild(toast);
    
        // Триггерим анимацию появления (через таймаут, чтобы применился CSS)
        setTimeout(() => {
            toast.classList.add('toast-show');
        }, 10);
    
        // Автоматически скрываем и удаляем через 2.5 секунды
        setTimeout(() => {
            toast.classList.remove('toast-show');
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }
    */

    // Загружаем профиль пользователя
    async function loadProfile() {
		const contentContainer = document.getElementById('profileContent');
		if (!contentContainer) return;

		try {
			// ШАГ 1: Запрашиваем авторизацию как сырой текст и вычищаем HTML-мусор
			const authResponse = await fetch('/api/check_auth.php?v=' + Date.now());
			const authRawText = await authResponse.text();
			
			let authData = { is_authenticated: false };
			try {
				const authJsonIdx = authRawText.indexOf('{');
				if (authJsonIdx !== -1) {
					authData = JSON.parse(authRawText.substring(authJsonIdx));
				}
			} catch(e) {
				console.error("Ошибка парсинга auth:", e);
			}

			// Если сессия пустая или сбросилась — мягко уводим на логин
			if (!authData || !authData.is_authenticated) {
				window.location.href = '/login.html';
				return;
			}

			// ШАГ 2: Запрашиваем данные профиля как сырой текст и тоже вычищаем мусор
			const response = await fetch('/api/get_profile.php?v=' + Date.now());
			const rawText = await response.text();

			let data;
			try {
				const jsonStartIdx = rawText.indexOf('{');
				if (jsonStartIdx === -1) throw new Error("JSON не найден");
				data = JSON.parse(rawText.substring(jsonStartIdx));
			} catch (jsonErr) {
				console.error("Не удалось раскодировать профиль. Ответ сервера:", rawText);
				window.location.href = '/login.html';
				return;
			}

			if (!data || !data.success) {
				window.location.href = '/login.html';
				return;
			}

			// Подхватываем данные (из любого формата ответа бэкенда)
			const user_info = data.user_info || data.user || null;
			const applications = data.applications || [];

            // Генерируем аватарку или текстовый кружок-заглушку
            let avatarPreviewHtml = '';
            if (user_info.avatar_url) {
				avatarPreviewHtml = `<img id="avatarPreview" src="${user_info.avatar_url}" alt="Аватар" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--color-primary, #4A90E2);">`;
			} else {
				avatarPreviewHtml = `<div id="avatarPreview" style="width: 100px; height: 100px; border-radius: 50%; background: #f0f0f2; display: flex; align-items: center; justify-content: center; font-size: 45px; border: 2px solid var(--color-primary, #4A90E2); user-select: none;">👤</div>`;
			}
            
            let html = `
             <div class="card" style="text-align: center;">
             <div class="avatar-container" style="position: relative; display: inline-block; margin-bottom: 15px; width: 100px; height: 100px;">
             ${avatarPreviewHtml}
             <label for="avatarFile" style="position: absolute; bottom: 0; right: 0; background: #fff; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; z-index: 10;">
             📷
             </label>
             <input type="file" id="avatarFile" accept="image/*" style="display: none;">
             </div>
             
             <form id="editProfileForm" style="text-align: left; margin-top: 15px;">
             <label style="display:block; margin-bottom:5px; font-weight:600;">Имя *</label>
             <input type="text" id="profFirstName" class="input-field" value="${escapeHtml(user_info.first_name)}" required><br><br>
             
             <label style="display:block; margin-bottom:5px; font-weight:600;">Фамилия</label>
             <input type="text" id="profLastName" class="input-field" value="${escapeHtml(user_info.last_name || '')}"><br><br>
             
             <label style="display:block; margin-bottom:5px; font-weight:600;">Город</label>
             <input type="text" id="profCity" class="input-field" value="${escapeHtml(user_info.city || '')}"><br><br>
             
             <label style="display:block; margin-bottom:5px; font-weight:600;">Телефон</label>
             <input type="tel" id="profPhone" class="input-field" value="${escapeHtml(user_info.phone || '')}"><br><br>
             
           <p><strong>Роль:</strong> ${
                user_info.role === 'leader' ? '🌿 Лидер' :
                    user_info.role === 'admin' ? '👑 Админ' :
                        user_info.role === 'observer' ? '👁️ Наблюдатель' :
                            '👤 Участник'}</p>
<p><strong>Email:</strong> ${escapeHtml(user_info.email)}</p>
             
             <button type="submit" class="btn btn-block" id="btnSaveProfile">💾 Сохранить изменения</button>
			 <button type="button" class="btn btn-block btn-danger" id="btnLogout" style="margin-top: 10px; background: #ff3b30; color: #fff;">🚪 Выйти из аккаунта</button>
             </form>
             </div>
				<div id="androidDownloadBlock" class="card" style="display: none; text-align: center; margin-top: 20px; border: 1px solid var(--color-primary, #4a90e2); background: #f4f8ff; border-radius: 16px; padding: 20px;">
					<h3 style="margin-top: 0; color: #1e1e20; font-size: 16px;">📱 Мобильное приложение</h3>
					<p style="font-size: 13px; color: #666; margin-bottom: 15px; line-height: 1.4;">
						Скачайте наше официальное приложение для Android, чтобы мгновенно получать пуш-уведомления о новых сообщениях в чатах!
					</p>
					<a href="/namahatta.apk" download="namahatta.apk" class="btn btn-block" style="background: #4a90e2; color: #fff; font-weight: 600; text-decoration: none; display: inline-block; padding: 10px; border-radius: 8px;">
						📥 Скачать APK (Прямая ссылка)
					</a>
				</div>
             `;

            // Мои личные заявки (блок участника)
            if (applications && applications.length > 0) {
                html += '<div class="card"><h3>📬 Мои заявки</h3><ul class="applications-list">';
                applications.forEach(app => {
                    let statusText = 'Ожидает';
                    let statusClass = 'status-pending';
                    if (app.status === 'approved') {
                        statusText = '✅ Одобрена';
                        statusClass = 'status-approved';
                    } else if (app.status === 'rejected') {
                        statusText = '❌ Отклонена';
                        statusClass = 'status-rejected';
                    }

                    html += `
                    <li class="application-item" style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f0f0f2;">
                        <div>
                            <strong>${escapeHtml(app.group_name)}</strong><br>
                            <small style="color:var(--color-text-muted);">${escapeHtml(app.message)}</small>
                        </div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                    `;

                    // Если заявка ожидает — показываем кнопку «Отменить»
					if (app.status === 'pending') {
						html += `<button class="btn btn-small btn-danger js-btn-cancel" data-app-id="${app.id}">Отменить</button>`;
					}

					// Если заявка одобрена — показываем кнопку «Выйти»
					if (app.status === 'approved') {
						html += `<button class="btn btn-small btn-ghost js-btn-leave" data-app-id="${app.id}" data-group-name="${escapeHtml(app.group_name)}">🚪 Выйти</button>`;
					}

					// 🔥 НОВОЕ: Если заявка ОТКЛОНЕНА — даем пользователю возможность ОЧИСТИТЬ её с экрана,
					// используя наш готовый системный класс js-btn-cancel!
					if (app.status === 'rejected') {
						html += `<button class="btn btn-small btn-ghost js-btn-cancel" data-app-id="${app.id}" style="color: var(--color-text-muted, #888); border-color: #ddd;">Удалить</button>`;
					}

                    html += '</div></li>';
                });
                html += '</ul></div>';
            } else {
                html += '<div class="card"><p style="color:var(--color-text-muted);">Вы пока не подавали заявок.</p></div>';
            }
            // Заявки на мои группы (для лидера или админа)
			if (user_info && (user_info.role === 'leader' || user_info.role === 'admin')) {
				let leader_applications = [];
				try {
					const leaderResponse = await fetch('/api/get_leader_applications.php?v=' + Date.now());
					
					// Если сервер вернул 403 или 401, мягко выходим из блока без генерации ошибок в консоль
					if (leaderResponse.status === 403 || leaderResponse.status === 401) {
						console.log("Доступ к панели лидера ограничен согласно роли аккаунта.");
					} else {
						const leaderData = await leaderResponse.json();
						leader_applications = leaderData.success ? leaderData.applications : [];
						
						// Отрисовываем блок лидера только если данные успешно пришли
						html += '<div class="card"><h3>📬 Заявки на мои группы</h3>';
						if (leader_applications && leader_applications.length > 0) {
							html += '<ul class="applications-list">';
							leader_applications.forEach(app => {
								html += `
								<li class="application-item" style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f0f0f2;">
									<div>
										<strong>${escapeHtml(app.applicant_name)}</strong><br>
										<small style="color:var(--color-text-muted);">${escapeHtml(app.group_name)} • ${escapeHtml(app.message)}</small>
									</div>
									<div style="display:flex; gap:8px;">
										<button class="btn btn-small btn-success js-leader-approve" data-app-id="${app.id}">✅</button>
										<button class="btn btn-small btn-danger js-leader-reject" data-app-id="${app.id}">❌</button>
									</div>
								</li>
								`;
							});
							html += '</ul>';
						} else {
							html += '<p style="color:var(--color-text-muted); text-align:center; margin:0;">Нет новых заявок</p>';
						}
						html += '</div>';
					}
				} catch (e) {
					console.warn("Внутренний пропуск чтения панели лидера:", e);
				}
			}

            if (user_info.role === 'admin') {
                html += '<a href="/admin.html" class="btn btn-block" style="margin-top:var(--space-m);">🛠 Админка</a>';
            }

            contentContainer.innerHTML = html;
			
			// 🔥 АКТИВИРУЕМ ПРОВЕРКУ ТИПА УСТРОЙСТВА
			// 🔥 СТАВИМ УМНЫЙ АВТОМАТИЧЕСКИЙ ПЕРЕКЛЮЧАТЕЛЬ НА МЕСТО
			const isAndroidDevice = /Android/i.test(navigator.userAgent);
			const apkDownloadEl = document.getElementById('androidDownloadBlock');

			if (apkDownloadEl) {
				// Показываем блок ТОЛЬКО если это Android И если пользователь зашел через обычный браузер (не из самого приложения)
				if (isAndroidDevice && !(typeof window.Android === 'object' && window.Android !== null)) {
					apkDownloadEl.style.display = 'block';
				} else {
					apkDownloadEl.style.display = 'none'; // Скрываем на компьютерах, айфонах и внутри WebView-оболочки
				}
			}
			/*const apkDownloadEl = document.getElementById('androidDownloadBlock');
			if (apkDownloadEl) {
				apkDownloadEl.style.display = 'block'; // Меняем временно на block, чтобы увидеть глазами
			}*/
			
			// 1. ПЕРЕХВАТЫВАЕМ КЛИК ПО КНОПКЕ ФОТОАППАРАТА ДЛЯ АНДРОИД
			const avatarLabel = document.querySelector('label[for="avatarFile"]');
			if (avatarLabel) {
				avatarLabel.addEventListener('click', function(e) {
					// Проверяем, открыты ли мы внутри Android WebView
					if (typeof window.Android === 'object' && window.Android !== null && typeof window.Android.openGallery === 'function') {
						e.preventDefault(); // Запрещаем стандартное поведение браузера
						window.Android.openGallery(); // Вызываем нативную галерею Android!
						return false;
					}
				});
			}
			
            
            // Привязываем выбор файла аватарки
			document.getElementById('avatarFile')?.addEventListener('change', function(e) {
				const files = e.target.files;
				if (files && files.length > 0) {
					const file = files[0];
					if (!file.type.startsWith('image/')) {
						showToast('⚠️ Пожалуйста, выберите файл изображения');
						return;
					}
					const reader = new FileReader();
					reader.onload = function(event) {
						openCropperModal(event.target.result, '/api/update_profile.php');
					};
					reader.readAsDataURL(file);
				}
			});
             
            // Привязываем отправку формы (остается без изменений)
            document.getElementById('editProfileForm')?.addEventListener('submit', saveProfileData);            

            // Настраиваем изолированные обработчики событий для кнопок (остается без изменений)
            setupEventListeners();

        } catch (error) {
            console.error('Ошибка профиля:', error);
        
        // Красивое интерактивное окно сбоя с кнопкой мгновенной перезагрузки
        contentContainer.innerHTML = `
            <div class="card" style="text-align: center; padding: 25px 20px; border: 1px solid rgba(255,59,48,0.15); box-shadow: 0 6px 16px rgba(255,59,48,0.06) !important;">
                <div style="font-size: 40px; margin-bottom: 10px; user-select: none;">⚠️</div>
                <h3 style="margin: 0 0 6px 0; font-size: 16px; font-weight: 700; color: #1d1d1f;">Не удалось загрузить профиль</h3>
                <p style="color: #666; font-size: 13px; margin: 0 0 20px 0; line-height: 1.4;">Возникла временная ошибка связи с сервером или сбой кэширования данных.</p>
                
                <button onclick="window.location.reload(true)" class="btn" style="margin: 0 auto; width: auto; min-width: 160px; padding: 10px 20px; font-size: 14px; background: #007aff; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 6px rgba(0,122,255,0.2);">
                    <span>Обновить экран</span> 🔄
                </button>
            </div>
        `;
		}
    }
    
    // Функция отправки измененных данных и аватара на бэкенд
    async function saveProfileData(e) {
     e.preventDefault();
     const button = document.getElementById('btnSaveProfile');
     if (!button) return;
     
     button.disabled = true;
     button.textContent = 'Сохранение...';
     
     // Используем FormData, чтобы корректно передать файл на сервер
     const formData = new FormData();
     formData.append('first_name', document.getElementById('profFirstName').value.trim());
     formData.append('last_name', document.getElementById('profLastName').value.trim());
     formData.append('city', document.getElementById('profCity').value.trim());
     formData.append('phone', document.getElementById('profPhone').value.trim());
     
     const fileInput = document.getElementById('avatarFile');
    if (fileInput && fileInput.files.length > 0) {
        formData.append('avatar', fileInput.files[0]); // Добавили [0]
    }
     
    try {
         const response = await fetch('/api/update_profile.php?v=' + Date.now(), {
         method: 'POST',
         body: formData, 
         credentials: 'include',
         });
         
         const result = await response.json();
         if (result.success) {
         showToast('✅ Профиль успешно обновлен!'); // Заменили alert
         loadProfile();
         } else {
         showToast('❌ Ошибка: ' + (result.error || 'Не удалось сохранить')); // Заменили alert
         }
         } catch (err) {
         console.error(err);
         showToast('❌ Не удалось связаться с сервером'); // Заменили alert
         } finally {
         button.disabled = false;
         button.textContent = '💾 Сохранить изменения';
         }
    }
    // Переменные для хранения ID выбранных элементов
	let pendingLeaveApplicationId = null;
	let pendingCancelApplicationId = null;

    // Настройка обработчиков событий (Изолированные селекторы)
    function setupEventListeners() {
		// 1. Логика работы модального окна ВЫХОДА ИЗ АККАУНТА
		document.getElementById('btnLogout')?.addEventListener('click', () => {
			const modal = document.getElementById('customLogoutModal');
			if (modal) modal.style.display = 'flex';
		});
		document.getElementById('btnCancelLogout')?.addEventListener('click', () => {
			const modal = document.getElementById('customLogoutModal');
			if (modal) modal.style.display = 'none';
		});
		document.getElementById('btnConfirmLogout')?.addEventListener('click', async () => {
			const modal = document.getElementById('customLogoutModal');
			if (modal) modal.style.display = 'none';
			try {
				const response = await fetch('/api/logout.php', { method: 'POST' });
				const result = await response.json();
				if (result.success) {
					window.location.href = '/login.html';
				} else {
					showToast('❌ Не удалось выйти: ' + (result.error || 'ошибка'));
				}
			} catch (err) {
				console.error(err);
				showToast('❌ Ошибка сети при попытке выхода');
			}
		});

		// 2. Логика работы модального окна ВЫХОДА ИЗ ГРУППЫ (Вместо confirm)
		document.querySelectorAll('.js-btn-leave').forEach(btn => {
			btn.addEventListener('click', () => {
				pendingLeaveApplicationId = btn.dataset.appId;
				const groupName = btn.dataset.groupName || '';
				const textEl = document.getElementById('leaveGroupModalText');
				if (textEl) textEl.textContent = `Вы уверены, что хотите выйти из группы «${groupName}»?`;
				
				const modal = document.getElementById('customLeaveGroupModal');
				if (modal) modal.style.display = 'flex';
			});
		});
		document.getElementById('btnCancelLeaveGroup')?.addEventListener('click', () => {
			const modal = document.getElementById('customLeaveGroupModal');
			if (modal) modal.style.display = 'none';
			pendingLeaveApplicationId = null;
		});
		document.getElementById('btnConfirmLeaveGroup')?.addEventListener('click', async () => {
			if (!pendingLeaveApplicationId) return;
			const modal = document.getElementById('customLeaveGroupModal');
			if (modal) modal.style.display = 'none';
			
			try {
				const response = await fetch('/api/leave_group.php', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ application_id: parseInt(pendingLeaveApplicationId) })
				});
				const result = await response.json();
				if (result.success) {
					showToast('✅ Вы успешно покинули группу');
					loadProfile();
				} else {
					showToast('❌ Ошибка: ' + (result.error || 'не удалось выйти'));
				}
			} catch (err) {
				console.error(err);
				showToast('❌ Ошибка соединения с сервером');
			} finally {
				pendingLeaveApplicationId = null;
			}
		});

		// 3. Логика работы модального окна ОТМЕНЫ СВОЕЙ ЗАЯВКИ (Вместо confirm)
		document.querySelectorAll('.js-btn-cancel').forEach(btn => {
			btn.addEventListener('click', () => {
				pendingCancelApplicationId = btn.dataset.appId;
				const modal = document.getElementById('customCancelAppModal');
				if (modal) modal.style.display = 'flex';
			});
		});
		document.getElementById('btnCancelAppModalClose')?.addEventListener('click', () => {
			const modal = document.getElementById('customCancelAppModal');
			if (modal) modal.style.display = 'none';
			pendingCancelApplicationId = null;
		});
		document.getElementById('btnConfirmCancelApp')?.addEventListener('click', async () => {
			if (!pendingCancelApplicationId) return;
			const modal = document.getElementById('customCancelAppModal');
			if (modal) modal.style.display = 'none';
			
			await cancelApplication(pendingCancelApplicationId);
			pendingCancelApplicationId = null;
		});

		// 4. Кнопки одобрения / отклонения чужих заявок лидерами (Здесь подтверждение не требуется)
		document.querySelectorAll('.js-leader-approve, .js-leader-reject').forEach(btn => {
			btn.addEventListener('click', async () => {
				const appId = btn.dataset.appId;
				const status = btn.classList.contains('js-leader-approve') ? 'approved' : 'rejected';
				await updateApplicationStatus(appId, status);
			});
		});
	}

    // AJAX: Отмена своей заявки
    // AJAX: Отмена своей заявки (Без алертов)
	async function cancelApplication(appId) {
		try {
			const response = await fetch('/api/cancel_application.php', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ application_id: parseInt(appId) })
			});
			const result = await response.json();
			if (result.success) {
				showToast('✅ Заявка успешно отменена');
				loadProfile();
			} else {
				showToast('❌ Ошибка: ' + (result.error || 'не удалось отменить'));
			}
		} catch (err) {
			console.error(err);
			showToast('❌ Не удалось отменить заявку');
		}
	}

    // AJAX: Изменение статуса чужой заявки лидером
    // AJAX: Изменение статуса чужой заявки лидером (Без алертов)
	async function updateApplicationStatus(appId, status) {
		try {
			const response = await fetch('/api/update_application_status.php', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ application_id: parseInt(appId), status: status })
			});
			
			const text = await response.text();
			let result;
			try {
				result = JSON.parse(text);
			} catch(e) {
				showToast('❌ Фатальный сбой ответа сервера');
				console.error("Критический ответ PHP:", text);
				return;
			}
			
			if (result.success) {
				if (status === 'approved') {
					showToast('✅ Заявка успешно одобрена');
				} else {
					showToast('ℹ️ Заявка отклонена');
				}
				loadProfile(); // Перезагружаем экран
			} else {
				showToast('❌ Ошибка бэкенда: ' + (result.error || 'не удалось обновить'));
			}
		} catch (err) {
			console.error(err);
			showToast('❌ Не удалось связаться с сервером');
		}
	}


    // Инициализация загрузки страницы
    document.addEventListener('DOMContentLoaded', loadProfile);
</script>
