<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Чаты — Нама-Хатта</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="js/android-hybrid-core.js"></script>
    <script src="theme.js"></script>
</head>
<body>
<div id="app">
    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Назад">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <h1 class="org-name">Чаты</h1>
        <div style="width: 22px;"></div>
    </header>

    <main class="content content-scroll" id="chatsContent" style="padding: 15px; overflow-y: auto;">
        <div class="loading">Загрузка...</div>
    </main>

    <nav class="bottom-bar">
        <a href="index.html" class="bar-btn">
            <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Главная</span>
        </a>
        <a href="namahatta.html" class="bar-btn">
            <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Группы</span>
        </a>
        <a href="profile.html" class="bar-btn">
            <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Профиль</span>
        </a>
    </nav>
</div>

<script>
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function loadChatsList() {
    const container = document.getElementById('chatsContent');
    try {
        const response = await fetch('/api/get_chats_list.php', { credentials: 'include' });
        const data = await response.json();

        let html = '';

        // Групповые чаты
        html += '<div class="chat-section-title" style="font-weight:700; font-size:16px; margin: 10px 0 10px 0;">Группы</div><div class="chat-list" style="display:flex; flex-direction:column; gap:10px;">';
        const groupsList = (data && data.groups && data.groups.length > 0) ? data.groups : [
            { id: 1, name: 'Нама-Хатта «Радха-Кришна»', city: 'Москва', group_avatar_url: null }
        ];

        groupsList.forEach(g => {
            let avatarHtml = g.group_avatar_url
                ? `<img src="${g.group_avatar_url}" class="chat-avatar" style="width:44px; height:44px; border-radius:50%; object-fit:cover;">`
                : `<div class="chat-avatar chat-avatar-placeholder" style="width:44px; height:44px; border-radius:50%; background:#eef2ff; display:flex; align-items:center; justify-content:center; font-size:22px;">🌸</div>`;

            html += `
                <div class="chat-item card" onclick="window.location.href='group.html?id=${g.id}&open_chat=1'" style="display:flex; align-items:center; gap:12px; padding:12px; cursor:pointer; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                    ${avatarHtml}
                    <div class="chat-item-info" style="flex:1;">
                        <div class="chat-item-name" style="font-weight:700; font-size:15px; color:#1d1d1f;">${escapeHtml(g.name)}</div>
                        <div class="chat-item-meta" style="font-size:13px; color:#86868b;">${escapeHtml(g.city || 'Москва')}</div>
                    </div>
                </div>`;
        });
        html += '</div>';

        // Личные сообщения
        html += '<div class="chat-section-title" style="font-weight:700; font-size:16px; margin: 25px 0 10px 0;">Личные сообщения</div><div class="chat-list" style="display:flex; flex-direction:column; gap:10px;">';
        const friendsList = (data && data.friends && data.friends.length > 0) ? data.friends : [];
        if (friendsList.length === 0) {
            html += '<p class="chat-empty" style="color:#86868b; font-size:14px; text-align:center; padding:10px;">В ваших группах пока нет других участников</p>';
        } else {
            friendsList.forEach(f => {
                let avatarHtml = f.avatar_url
                    ? `<img src="${f.avatar_url}" class="chat-avatar" style="width:44px; height:44px; border-radius:50%; object-fit:cover;">`
                    : `<div class="chat-avatar chat-avatar-placeholder" style="width:44px; height:44px; border-radius:50%; background:#f0f0f2; display:flex; align-items:center; justify-content:center; font-size:22px;">👤</div>`;

                html += `
                    <div class="chat-item card" onclick="window.location.href='group.html?id=${f.group_id || 1}&open_private_chat=${f.id}&open_private_name=${encodeURIComponent(f.first_name)}'" style="display:flex; align-items:center; gap:12px; padding:12px; cursor:pointer; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                        ${avatarHtml}
                        <div class="chat-item-info" style="flex:1;">
                            <div class="chat-item-name" style="font-weight:700; font-size:15px; color:#1d1d1f;">${escapeHtml(f.first_name)} ${escapeHtml(f.last_name || '')}</div>
                            <div class="chat-item-meta" style="font-size:13px; color:#0071e3;">Написать личное сообщение</div>
                        </div>
                    </div>`;
            });
        }
        html += '</div>';

        container.innerHTML = html;

    } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="error-state" style="text-align:center; padding:40px;">Не удалось загрузить список чатов</p>';
    }
}

document.addEventListener('DOMContentLoaded', loadChatsList);
</script>
<script src="android.js"></script>
<script src="web-push-suppression.js"></script>
<script src="web-push.js"></script>
</body>
</html>
