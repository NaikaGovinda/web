<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Чаты — Нама-Хатта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='/index.html'" aria-label="Назад">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <h1 class="org-name">Чаты</h1>
    </header>

    <main class="content" id="chatsContent">
        <div class="loading">Загрузка...</div>
    </main>
</div>

<script src="/android.js"></script>
<script src="/web-push-suppression.js"></script>
<script src="/web-push.js"></script>
<script>
 const IS_DEBUG = true; 
 const APP_VERSION = '1.0.0'; 
 (function() {
     const version = IS_DEBUG ? Date.now() : APP_VERSION;
     const mainStyle = document.querySelector('link[href^="style.css"]');
     if (mainStyle) { mainStyle.href = 'style.css?v=' + version; }
     const themeScript = document.createElement('script');
     themeScript.src = 'theme.js?v=' + version;
     document.body.appendChild(themeScript);
 })();
</script>

<script>
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function loadChatsList() {
    const container = document.getElementById('chatsContent');
    try {
        const authRes = await fetch('/api/check_auth.php', { credentials: 'include' });
        const authData = await authRes.json();
        if (!authData.is_authenticated) { window.location.href = '/login.html'; return; }

        const response = await fetch('/api/get_chats_list.php', { credentials: 'include' });
        const data = await response.json();
        if (!data.success) throw new Error(data.error || 'Ошибка загрузки');

        let html = '';

        // Групповые чаты
        html += '<div class="chat-section-title">Группы</div><div class="chat-list">';
        if (!data.groups || data.groups.length === 0) {
            html += '<p class="chat-empty">Вы пока не состоите ни в одной группе</p>';
        } else {
            data.groups.forEach(g => {
                let avatarHtml = '';
                if (g.group_avatar_url) {
                    avatarHtml = `<img src="${g.group_avatar_url}" class="chat-avatar" alt="">`;
                } else {
                    avatarHtml = `<div class="chat-avatar chat-avatar-placeholder">🌸</div>`;
                }
                html += `
                    <div class="chat-item" onclick="window.location.href='/group.html?id=${g.id}&open_chat=1'">
                        ${avatarHtml}
                        <div class="chat-item-info">
                            <div class="chat-item-name">${escapeHtml(g.name)}</div>
                            <div class="chat-item-meta">${escapeHtml(g.city)}</div>
                        </div>
                    </div>`;
            });
        }
        html += '</div>';

        // Личные диалоги
        html += '<div class="chat-section-title">Личные сообщения</div><div class="chat-list">';
        const defaultGroupId = (data.groups && data.groups.length > 0) ? data.groups[0].id : '';
        if (!data.friends || data.friends.length === 0) {
            html += '<p class="chat-empty">В ваших группах пока нет других участников</p>';
        } else {
            data.friends.forEach(f => {
                let avatarHtml = '';
                if (f.avatar_url) {
                    avatarHtml = `<img src="${f.avatar_url}" class="chat-avatar" alt="">`;
                } else {
                    avatarHtml = `<div class="chat-avatar chat-avatar-placeholder">👤</div>`;
                }
                html += `
                    <div class="chat-item" onclick="window.location.href='/group.html?id=${f.group_id || defaultGroupId || 0}&open_private_chat=${f.id}&open_private_name=${encodeURIComponent(f.first_name)}'">
                        ${avatarHtml}
                        <div class="chat-item-info">
                            <div class="chat-item-name">${escapeHtml(f.first_name)} ${escapeHtml(f.last_name || '')}</div>
                            <div class="chat-item-meta">Написать личное сообщение</div>
                        </div>
                    </div>`;
            });
        }
        html += '</div>';

        container.innerHTML = html;

    } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="error-state" style="text-align:center;">Ошибка соединения</p>';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    loadChatsList();
    if (typeof WEB_PUSH !== 'undefined') { WEB_PUSH.init(); }
    if (typeof window.WEB_PUSH_VISIBILITY !== 'undefined') { window.WEB_PUSH_VISIBILITY.setChats(); }
});
</script>
</body>
</html>
