    <a href="/namahatta.apk" download="namahatta.apk" class="btn btn-block" style="background: #4a90e2; color: #fff; font-weight: 600; text-decoration: none; display: block; padding: 10px; border-radius: 8px; font-size: 14px; text-align: center; box-sizing: border-box; width: 100%;">

<script>
  async function checkAuth() {
    try {
      const response = await fetch('/api/check_auth.php');
      const data = await response.json();
      const container = document.getElementById('authContainer');

      if (data.is_authenticated) {
        // Полностью скрываем контейнер с кнопкой
        container.style.display = 'none';
      } else {
        // Показываем кнопку входа
        container.innerHTML = '<a href="/login.html" class="btn btn-primary">Войти или зарегистрироваться</a>';
      }
    } catch (error) {
      // При ошибке — показываем кнопку входа
      container.innerHTML = '<a href="/login.html" class="btn btn-primary">Войти или зарегистрироваться</a>';
    }
  }

  document.addEventListener('DOMContentLoaded', checkAuth);
</script>
<script src="/android.js"></script>
<script>
 const IS_DEBUG = true; 
 const APP_VERSION = '1.0.0'; 

 (function() {
     const version = IS_DEBUG ? Date.now() : APP_VERSION;

     const mainStyle = document.querySelector('link[href^="style.css"]');
     if (mainStyle) {
         mainStyle.href = 'style.css?v=' + version;
     }

     const themeScript = document.createElement('script');
     themeScript.src = 'theme.js?v=' + version;
     document.body.appendChild(themeScript);
 })();
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const isAndroid = /Android/i.test(navigator.userAgent);
    const apkBlock = document.getElementById('indexAndroidDownloadBlock');
    
    if (apkBlock) {
        // Кнопка включится автоматически только на Android и только в обычном браузере
        if (isAndroid && !(typeof window.Android === 'object' && window.Android !== null)) {
            apkBlock.style.display = 'block';
        } else {
            apkBlock.style.display = 'none';
        }
    }
});
</script>
