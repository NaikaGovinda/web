<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Регистрация — Нама-Хатта</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="back-btn" onclick="history.back()" aria-label="Назад">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h1 class="org-name">Регистрация</h1>
    </header>

    <main class="content">
      <div class="auth-card">
        <h2>Создать аккаунт</h2>
        <p class="auth-subtitle">Заполните данные для регистрации</p>
        <form id="registerForm">
          <div class="form-group">
            <label for="first_name">Имя *</label>
            <input type="text" id="first_name" name="first_name" class="input-field" placeholder="Иван" required>
          </div>
          <div class="form-group">
            <label for="last_name">Фамилия</label>
            <input type="text" id="last_name" name="last_name" class="input-field" placeholder="Необязательно">
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" class="input-field" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="phone" class="input-field" placeholder="+7 (___) ___-__-__">
          </div>
          <div class="form-group">
            <label for="password">Пароль *</label>
            <input type="password" id="password" name="password" class="input-field" placeholder="Минимум 6 символов" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>
        <div class="auth-footer">
          <span>Уже есть аккаунт? </span>
          <a href="/login.html">Войти</a>
        </div>
      </div>
    </main>
  </div>

<div id="verifyModal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3 style="text-align:center; margin-bottom:8px;">Подтверждение</h3>
        <p style="text-align:center; color:var(--color-muted); font-size:14px; margin-bottom:20px;">Введите 6-значный код, отправленный на вашу почту</p>
        <input type="text" id="modalCode" maxlength="6" placeholder="000000" 
               class="input-field" style="text-align:center; letter-spacing:8px; font-size:24px; margin-bottom:20px;">
        <button id="confirmCodeBtn" class="btn btn-primary">Подтвердить</button>
        <div id="modalError" style="color:var(--color-danger); margin-top:12px; font-size:14px; text-align:center; display:none;"></div>
    </div>
</div>

<script>
document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    if (submitBtn) submitBtn.disabled = true;

    const formData = new FormData();
    formData.append('first_name', document.getElementById('first_name').value.trim());
    formData.append('last_name', document.getElementById('last_name').value.trim());
    formData.append('email', document.getElementById('email').value.trim());
    formData.append('phone', document.getElementById('phone').value.trim());
    formData.append('password', document.getElementById('password').value);

    try {
        const res = await fetch('/api/register.php?v=' + Date.now(), { method: 'POST', body: formData });
        const text = await res.text();
        const jsonIdx = text.indexOf('{');
        const data = jsonIdx !== -1 ? JSON.parse(text.substring(jsonIdx)) : { success: false, error: 'Ошибка сервера' };

        if (data.success) {
            showToast('📩 Код отправлен на почту!');
            document.getElementById('verifyModal').style.display = 'flex';
        } else {
            showToast('❌ ' + (data.error || 'Ошибка регистрации'));
            if (submitBtn) submitBtn.disabled = false;
        }
    } catch (err) {
        if (submitBtn) submitBtn.disabled = false;
        showToast('❌ ' + err.message);
    }
});

document.getElementById('confirmCodeBtn')?.addEventListener('click', async () => {
    const code = document.getElementById('modalCode').value.trim();
    const btn = document.getElementById('confirmCodeBtn');
    const errorDiv = document.getElementById('modalError');

    if (code.length !== 6) {
        errorDiv.innerText = "Введите 6 цифр";
        errorDiv.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.innerText = "Проверка...";
    if (errorDiv) errorDiv.style.display = 'none';

    try {
        const res = await fetch('/api/verify_email.php?v=' + Date.now(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        });
        const data = await res.json();

        if (data.success) {
            showToast('🎉 Почта подтверждена!');
            setTimeout(() => { window.location.href = '/index.html?v=' + Date.now(); }, 1200);
        } else {
            errorDiv.innerText = data.error || "Неверный код";
            errorDiv.style.display = 'block';
            btn.disabled = false;
            btn.innerText = "Подтвердить код";
        }
    } catch (err) {
        btn.disabled = false;
        btn.innerText = "Подтвердить код";
        showToast('❌ Ошибка связи с сервером');
    }
});
</script>

<script src="/android.js"></script>
<script>
 const IS_DEBUG = true; 
 const APP_VERSION = '1.0.0'; 
 (function() {
     const version = IS_DEBUG ? Date.now() : APP_VERSION;
     const mainStyle = document.querySelector('link[href^="style.css"]');
     if (mainStyle) { mainStyle.href = 'style.css?v=' + version; }
     const themeScript = document.createElement('script');
     themeScript.src = 'theme.js?v=' + version;
     document.body.appendChild(themeScript);
 })();
</script>
</body>
</html>
