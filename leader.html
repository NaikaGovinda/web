<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Лидер — Нама-Хатта</title>
    <!-- <link href="https://googleapis.com" rel="stylesheet"> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <!-- Шапка -->
    <header class="app-header">
        <button class="back-btn" id="btnBack" aria-label="Назад" onclick="history.back()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <h1 class="org-name">Заявки</h1>
    </header>

    <!-- Основной контент -->
    <main class="content" id="leaderContent">
        <div class="loading">Загрузка...</div>
    </main>

    <!-- Нижняя панель -->
    <nav class="bottom-bar">
        <a href="/index.html" class="bar-btn">
            <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Главная</span>
        </a>
        <a href="/namahatta.html" class="bar-btn bar-btn-active">
            <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Группы</span>
        </a>
        <a href="/profile.html" class="bar-btn">
            <svg class="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Профиль</span>
        </a>
    </nav>
</div>

<script>
    // Защита от XSS
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // [ИСПРАВЛЕНО] Загружаем заявки лидера через сессию бэкенда (без Telegram ID)
    async function loadLeaderApplications() {
        const contentContainer = document.getElementById('leaderContent');
        try {
            // Запрашиваем данные. Бэкенд сам поймет по $_SESSION['user_id'], какие группы ведет этот лидер
            const response = await fetch('/api/get_leader_applications.php');
            const text = await response.text();
            
            let data;
            try {
                data = JSON.parse(text);
            } catch(e) {
                throw new Error("Ошибка сервера (не JSON ответ)");
            }

            if (!data.success) throw new Error(data.error || 'Ошибка загрузки');

            let html = '';

            if (!data.applications || data.applications.length === 0) {
                html = '<div class="card"><p style="text-align:center; color:var(--color-text-muted);">Нет новых заявок</p></div>';
            } else {
                html = '<div class="card"><h3>Новые заявки</h3><ul class="applications-list">';
                data.applications.forEach(app => {
                    html += `
                    <li class="application-item" style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #f0f0f2;">
                        <div>
                            <strong>${escapeHtml(app.applicant_name)}</strong><br>
                            <small style="color:var(--color-text-muted);">${escapeHtml(app.group_name)} • ${escapeHtml(app.message)}</small>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button class="btn btn-small btn-success" data-app-id="${app.id}">✅</button>
                            <button class="btn btn-small btn-danger" data-app-id="${app.id}">❌</button>
                        </div>
                    </li>
                    `;
                });
                html += '</ul></div>';
            }

            contentContainer.innerHTML = html;

            // Навешиваем обработчики кликов на кнопки одобрения и отклонения
            document.querySelectorAll('.application-item .btn-success').forEach(btn => {
                btn.addEventListener('click', () => handleAction(btn.dataset.appId, 'approved'));
            });
            document.querySelectorAll('.application-item .btn-danger').forEach(btn => {
                btn.addEventListener('click', () => handleAction(btn.dataset.appId, 'rejected'));
            });

        } catch (error) {
            console.error('Ошибка:', error);
            contentContainer.innerHTML = `<div class="card"><p class="error-state" style="color:var(--color-error); text-align:center;">${error.message}</p></div>`;
        }
    }

    // [ИСПРАВЛЕНО] Обработка одобрения/отклонения через сессию PHP
    // [ИСПРАВЛЕНО] Обработка одобрения/отклонения через сессию PHP (Без алертов)
	async function handleAction(appId, status) {
		try {
			// Передаем только ID заявки и новый статус. Личность лидера бэкенд проверит сам по сессии!
			const response = await fetch('/api/update_application_status.php', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ application_id: parseInt(appId), status: status })
			});
			
			const result = await response.json();
			if (result.success) {
				// Выводим красивое уведомление в зависимости от выбранного действия
				if (status === 'approved') {
					showToast('✅ Заявка успешно одобрена');
				} else {
					showToast('ℹ️ Заявка отклонена');
				}
				loadLeaderApplications(); // Перезагружаем список заявок на экране
			} else {
				showToast('❌ Ошибка: ' + (result.error || 'не удалось обновить статус'));
			}
		} catch (err) {
			showToast('❌ Не удалось связаться с сервером для обновления заявки');
			console.error(err);
		}
	}

    // Запускаем инициализацию при загрузке страницы
    document.addEventListener('DOMContentLoaded', loadLeaderApplications);
</script>

<!-- Поддержка Android -->
<script src="android.js?v=20260222"></script>
<script>
 const IS_DEBUG = true; 
 const APP_VERSION = '1.0.0'; 

 (function() {
     const version = IS_DEBUG ? Date.now() : APP_VERSION;

     const mainStyle = document.querySelector('link[href^="style.css"]');
     if (mainStyle) {
         mainStyle.href = 'style.css?v=' + version;
     }

     const themeScript = document.createElement('script');
     themeScript.src = 'theme.js?v=' + version;
     document.body.appendChild(themeScript);
 })();
</script>

</body>
</html>
